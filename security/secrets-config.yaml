# Secrets Configuration for AGASSOCIATES Rotation Script
# Place at: /etc/agassociates/secrets/secrets-config.yaml
# This file defines all secrets that should be rotated

secrets:
  # Database & Cache
  - name: "DATABASE_PASSWORD"
    description: "PostgreSQL database password for all services"
    generator: "random"
    length: 32
    rotation_days: 90
    services:
      - "ag-ai-backend"
      - "ag-platform"
      - "intake-api"
      - "coordinator"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "postgres-credentials"

  - name: "REDIS_PASSWORD"
    description: "Redis password for caching and message broker"
    generator: "random"
    length: 32
    rotation_days: 90
    services:
      - "ag-ai-backend"
      - "ag-platform"
      - "intake-api"
      - "coordinator"
      - "n8n"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "redis-credentials"

  # Authentication & Authorization
  - name: "JWT_SECRET"
    description: "JWT signing secret for API authentication"
    generator: "jwt"
    rotation_days: 90
    services:
      - "ag-ai-backend"
      - "ag-platform"
      - "intake-api"
      - "coordinator"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "jwt-secret"

  - name: "ENCRYPTION_KEY"
    description: "Application-level encryption key (32 bytes, base64 encoded)"
    generator: "random"
    length: 44
    rotation_days: 90
    services:
      - "ag-ai-backend"
      - "ag-platform"
      - "intake-api"
      - "coordinator"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "encryption-key"

  # Webhook Security
  - name: "WEBHOOK_SECRET"
    description: "Secret for verifying webhook signatures (WhatsApp, bank callbacks)"
    generator: "random"
    length: 64
    rotation_days: 90
    services:
      - "ag-ai-backend"
      - "intake-api"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "webhook-secrets"

  - name: "N8N_WEBHOOK_KEY"
    description: "n8n webhook authentication key for workflow triggers"
    generator: "uuid"
    rotation_days: 90
    services:
      - "n8n"
      - "ag-ai-backend"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "n8n-webhook-key"

  # External API Keys
  - name: "TELEGRAM_BOT_TOKEN"
    description: "Telegram bot token for coordinator service"
    generator: "random"
    length: 64
    rotation_days: 90
    services:
      - "coordinator"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "telegram-bot-token"

  - name: "GEMINI_API_KEY"
    description: "Google Gemini API key for AI features"
    generator: "random"
    length: 64
    rotation_days: 90
    services:
      - "ag-platform"
      - "coordinator"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "gemini-api-key"

  - name: "GROQ_API_KEY"
    description: "Groq API key for LLM inference (ag-ai-backend)"
    generator: "random"
    length: 64
    rotation_days: 90
    services:
      - "ag-ai-backend"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "groq-api-key"

  - name: "SUPABASE_SERVICE_ROLE_KEY"
    description: "Supabase service role key for backend admin access"
    generator: "random"
    length: 64
    rotation_days: 90
    services:
      - "ag-platform"
      - "intake-api"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "supabase-keys"

  - name: "SUPABASE_ANON_KEY"
    description: "Supabase anonymous key for frontend access"
    generator: "random"
    length: 64
    rotation_days: 90
    services:
      - "ag-platform"
      - "intake-api"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "supabase-keys"

  # Monitoring & Deployment
  - name: "SENTRY_DSN"
    description: "Sentry DSN for error tracking"
    generator: "random"
    length: 64
    rotation_days: 90
    services:
      - "ag-platform"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "sentry-dsn"

  - name: "COOLIFY_API_TOKEN"
    description: "Coolify API token for automated deployments"
    generator: "random"
    length: 64
    rotation_days: 90
    services:
      - "coordinator"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "coolify-api-token"

  # Communication Services
  - name: "SMTP_PASSWORD"
    description: "SMTP password for transactional emails"
    generator: "random"
    length: 32
    rotation_days: 90
    services:
      - "ag-ai-backend"
      - "ag-platform"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "smtp-credentials"

  - name: "TWILIO_AUTH_TOKEN"
    description: "Twilio auth token for SMS/OTP delivery"
    generator: "random"
    length: 64
    rotation_days: 90
    services:
      - "intake-api"
    env_files:
      - ".env.production"
    k8s_secrets:
      - "twilio-credentials"

  # TLS/mTLS Certificates (managed separately but tracked)
  - name: "MTLS_CA_CERT"
    description: "mTLS Certificate Authority certificate"
    generator: "random"
    length: 64
    rotation_days: 365
    services:
      - "caddy"
      - "ag-ai-backend"
      - "ag-ai-dashboard"
      - "ag-platform"
      - "intake-api"
      - "coordinator"
      - "postgres"
      - "redis"
      - "n8n"
    env_files: []
    k8s_secrets:
      - "mtls-ca"

  - name: "MTLS_CLIENT_CERT"
    description: "mTLS client certificate for service-to-service auth"
    generator: "random"
    length: 64
    rotation_days: 90
    services:
      - "ag-ai-backend"
      - "ag-ai-dashboard"
      - "ag-platform"
      - "intake-api"
      - "coordinator"
    env_files: []
    k8s_secrets:
      - "mtls-client-certs"

# Rotation schedule
schedule:
  # Daily check at 2 AM UTC
  check_cron: "0 2 * * *"
  # Run rotation on first day of quarter
  rotation_cron: "0 3 1 */3 *"

# Notification settings
notifications:
  slack_webhook: "${SLACK_WEBHOOK_URL}"
  teams_webhook: "${TEAMS_WEBHOOK_URL}"
  email:
    smtp_host: "${SMTP_HOST}"
    smtp_port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    from: "${SMTP_FROM}"
    to:
      - "${SECURITY_ALERT_EMAIL}"