# Network Policies for AGASSOCIATES Coolify Services
# Kubernetes NetworkPolicy resources for service-to-service communication control
# Compatible with Coolify deployment on Kubernetes

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: agassociates
  labels:
    app: agassociates
    policy: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules = deny all ingress
  # No egress rules = deny all egress
---
# Allow DNS resolution for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: agassociates
  labels:
    app: agassociates
    policy: dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Caddy Reverse Proxy - Ingress from Internet, Egress to Backend Services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: caddy-ingress-egress
  namespace: agassociates
  labels:
    app: agassociates
    component: caddy
    policy: ingress-egress
spec:
  podSelector:
    matchLabels:
      app: caddy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP/HTTPS from Internet (via LoadBalancer/Ingress Controller)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Allow health checks from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Allow admin API from management namespace (restricted)
    - from:
        - namespaceSelector:
            matchLabels:
              name: management
      ports:
        - protocol: TCP
          port: 2019
  egress:
    # Allow to ag-ai-backend
    - to:
        - podSelector:
            matchLabels:
              app: ag-ai-backend
      ports:
        - protocol: TCP
          port: 8001
    # Allow to ag-ai-dashboard
    - to:
        - podSelector:
            matchLabels:
              app: ag-ai-dashboard
      ports:
        - protocol: TCP
          port: 3443
    # Allow to ag-platform
    - to:
        - podSelector:
            matchLabels:
              app: ag-platform
      ports:
        - protocol: TCP
          port: 3444
    # Allow to intake-api
    - to:
        - podSelector:
            matchLabels:
              app: intake-api
      ports:
        - protocol: TCP
          port: 3445
    # Allow to coordinator
    - to:
        - podSelector:
            matchLabels:
              app: coordinator
      ports:
        - protocol: TCP
          port: 3446
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow external API calls (Groq, Gemini, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
---
# ag-ai-backend - FastAPI Backend Service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ag-ai-backend
  namespace: agassociates
  labels:
    app: agassociates
    component: ag-ai-backend
    policy: backend
spec:
  podSelector:
    matchLabels:
      app: ag-ai-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Caddy
    - from:
        - podSelector:
            matchLabels:
              app: caddy
      ports:
        - protocol: TCP
          port: 8001
    # Allow from n8n
    - from:
        - podSelector:
            matchLabels:
              app: n8n
      ports:
        - protocol: TCP
          port: 8001
    # Allow from ag-platform (for API calls)
    - from:
        - podSelector:
            matchLabels:
              app: ag-platform
      ports:
        - protocol: TCP
          port: 8001
    # Allow from intake-api
    - from:
        - podSelector:
            matchLabels:
              app: intake-api
      ports:
        - protocol: TCP
          port: 8001
    # Allow from coordinator
    - from:
        - podSelector:
            matchLabels:
              app: coordinator
      ports:
        - protocol: TCP
          port: 8001
    # Allow health checks from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8001
  egress:
    # Allow to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5433
    # Allow to Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6380
    # Allow to n8n (for webhooks)
    - to:
        - podSelector:
            matchLabels:
              app: n8n
      ports:
        - protocol: TCP
          port: 5679
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow external API calls (Groq, WhatsApp, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
---
