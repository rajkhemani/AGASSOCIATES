# Coolify-Specific Network Policies
# These policies work with Coolify's service discovery and deployment model

# Coolify Proxy - Handles incoming traffic from Coolify's ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coolify-proxy
  namespace: agassociates
  labels:
    app: agassociates
    component: coolify-proxy
    policy: proxy
spec:
  podSelector:
    matchLabels:
      coolify.io/proxy: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Coolify ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: coolify
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
  egress:
    # Allow to all application services
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 3443
        - protocol: TCP
          port: 3444
        - protocol: TCP
          port: 3445
        - protocol: TCP
          port: 3446
        - protocol: TCP
          port: 5679
---
# Coolify Build/Deploy Namespace Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coolify-build-access
  namespace: agassociates
  labels:
    app: agassociates
    component: coolify-build
    policy: build-access
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow Coolify build pods to pull images and deploy
    - from:
        - namespaceSelector:
            matchLabels:
              name: coolify
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5000  # Registry
---
# Allow Coolify to manage resources
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coolify-management
  namespace: agassociates
  labels:
    app: agassociates
    component: coolify-management
    policy: management
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow Coolify API server to reach Kubernetes API
    - to:
        - namespaceSelector:
            matchLabels:
              name: coolify
      ports:
        - protocol: TCP
          port: 6443  # Kubernetes API
---
# Emergency Break-glass Policy
# Apply this to allow all traffic during incidents
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: emergency-allow-all
#   namespace: agassociates
#   labels:
#     app: agassociates
#     policy: emergency
# spec:
#   podSelector: {}
#   policyTypes:
#     - Ingress
#     - Egress
#   ingress:
#     - from: []
#       ports: []
#   egress:
#     - to: []
#       ports: []

# Coolify Deployment Annotations
# Add these annotations to your Coolify application configurations:
#
# For each service in Coolify, add these labels to the deployment:
# labels:
#   app: <service-name>  # e.g., ag-ai-backend, ag-ai-dashboard, etc.
#   coolify.io/managed: "true"
#
# For the Caddy service:
# labels:
#   app: caddy
#   coolify.io/proxy: "true"
#   coolify.io/managed: "true"
#
# Network policies will automatically apply based on these labels.