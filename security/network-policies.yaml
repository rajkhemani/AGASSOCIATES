# Monitoring Stack (Prometheus, Grafana, Loki, etc.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring
  namespace: monitoring
  labels:
    app: monitoring
    policy: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Caddy (for Grafana access)
    - from:
        - namespaceSelector:
            matchLabels:
              name: agassociates
        - podSelector:
            matchLabels:
              app: caddy
      ports:
        - protocol: TCP
          port: 3000  # Grafana
        - protocol: TCP
          port: 9090  # Prometheus
        - protocol: TCP
          port: 3100  # Loki
    # Allow from management
    - from:
        - namespaceSelector:
            matchLabels:
              name: management
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9090
  egress:
    # Allow to all agassociates services for scraping
    - to:
        - namespaceSelector:
            matchLabels:
              name: agassociates
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 3443
        - protocol: TCP
          port: 3444
        - protocol: TCP
          port: 3445
        - protocol: TCP
          port: 3446
        - protocol: TCP
          port: 5679
        - protocol: TCP
          port: 5433
        - protocol: TCP
          port: 6380
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9100  # node-exporter
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow to external (Alertmanager, webhook receivers)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
---
