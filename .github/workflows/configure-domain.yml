name: Configure Custom Domain

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  configure-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Configure GitHub Pages
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/domains \
            -d '{"domain":"advadiityagade.com"}'
          echo "Custom domain configuration attempted"
