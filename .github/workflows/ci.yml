name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # STAGE 1: Lint (parallel per subsystem)
  # ──────────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint — Python (ag-associates-ai/backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-associates-ai/backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ag-associates-ai/backend/requirements.txt
      - run: pip install ruff==0.16.1
      - run: ruff check .
      - run: ruff format --check .
    # BASELINE (ruff 0.16.1 from ag-associates-ai/backend): 874 errors (pre-existing, do not add to count)

  lint-js-web:
    name: Lint — JS (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint

  lint-js-ai-frontend:
    name: Lint — JS (ag-associates-ai/frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-associates-ai/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-associates-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  lint-js-platform:
    name: Lint — JS (ag-platform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-platform/package-lock.json
      - run: npm ci
      - run: npm run lint

  # ──────────────────────────────────────────────────────────────────────
  # STAGE 2: Type-check (parallel per subsystem)
  # ──────────────────────────────────────────────────────────────────────
  typecheck-python:
    name: Type-check — Python (ag-associates-ai/backend)
    runs-on: ubuntu-latest
    needs: [lint-python]
    defaults:
      run:
        working-directory: ag-associates-ai/backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ag-associates-ai/backend/requirements.txt
      - run: pip install -r requirements.txt mypy
      - run: mypy --strict --ignore-missing-imports .

  typecheck-js-web:
    name: Type-check — JS (apps/web)
    runs-on: ubuntu-latest
    needs: [lint-js-web]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  typecheck-js-ai-frontend:
    name: Type-check — JS (ag-associates-ai/frontend)
    runs-on: ubuntu-latest
    needs: [lint-js-ai-frontend]
    defaults:
      run:
        working-directory: ag-associates-ai/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-associates-ai/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  typecheck-js-platform:
    name: Type-check — JS (ag-platform)
    runs-on: ubuntu-latest
    needs: [lint-js-platform]
    defaults:
      run:
        working-directory: ag-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-platform/package-lock.json
      - run: npm ci
      - run: npm run type-check

  # ──────────────────────────────────────────────────────────────────────
  # STAGE 3: Unit Tests (parallel per subsystem)
  # ──────────────────────────────────────────────────────────────────────
  unit-tests-python:
    name: Unit Tests — Python (ag-associates-ai/backend)
    runs-on: ubuntu-latest
    needs: [typecheck-python]
    defaults:
      run:
        working-directory: ag-associates-ai/backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ag-associates-ai/backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: pytest --cov=./ --cov-report=xml --cov-fail-under=50
        env:
          ENVIRONMENT: test
          LLM_MOCK_MODE: "true"
          DATABASE_PASSWORD: "test_password"
          SUPABASE_JWT_SECRET: "test_jwt_secret"
          N8N_WEBHOOK_KEY: "test_webhook_key"
          TELEGRAM_BOT_TOKEN: "test_bot_token"
          IGR_PORTAL_USERNAME: "test_user"
          IGR_PORTAL_PASSWORD: "test_pass"
          ZOHO_EMAIL_PASS: "test_email_pass"

  unit-tests-js-web:
    name: Unit Tests — JS (apps/web)
    runs-on: ubuntu-latest
    needs: [typecheck-js-web]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test --if-present

  unit-tests-js-ai-frontend:
    name: Unit Tests — JS (ag-associates-ai/frontend)
    runs-on: ubuntu-latest
    needs: [typecheck-js-ai-frontend]
    defaults:
      run:
        working-directory: ag-associates-ai/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-associates-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm test --if-present

  unit-tests-js-platform:
    name: Unit Tests — JS (ag-platform)
    runs-on: ubuntu-latest
    needs: [typecheck-js-platform]
    defaults:
      run:
        working-directory: ag-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-platform/package-lock.json
      - run: npm ci
      - run: npm test
    # KNOWN ISSUE: vitest needs 'ws' transport on Node < 22 (pre-existing, tracked in remediation)

  # ──────────────────────────────────────────────────────────────────────
  # STAGE 4: Integration Tests (placeholder - expand as needed)
  # ──────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-python, unit-tests-js-web, unit-tests-js-ai-frontend, unit-tests-js-platform]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Placeholder — no integration tests configured yet
        run: echo "No integration tests configured; add when available"

  # ──────────────────────────────────────────────────────────────────────
  # STAGE 5: Two-Tenant Security Suite (placeholder)
  # ──────────────────────────────────────────────────────────────────────
  two-tenant-security:
    name: Two-Tenant Security Suite
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Placeholder — two-tenant security suite not yet implemented
        run: echo "Two-tenant security suite not yet implemented; add when available"

  # ──────────────────────────────────────────────────────────────────────
  # STAGE 6: Clean DB Migration Test (from db-migration-test.yml)
  # ──────────────────────────────────────────────────────────────────────
  db-migration-test:
    name: DB Migration Test — Clean Bootstrap & Idempotency
    runs-on: ubuntu-latest
    needs: [two-tenant-security]
    defaults:
      run:
        working-directory: ag-platform

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ag_owner
          POSTGRES_PASSWORD: ag_owner_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ag_owner -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ag_owner -d postgres; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Run migrations on clean database (first run)
        env:
          DATABASE_URL: postgres://ag_owner:ag_owner_password@localhost:5432/postgres
          DB_MIGRATION_USER: ag_owner
          DB_MIGRATION_PASSWORD: ag_owner_password
          DB_MIGRATION_HOST: localhost
          DB_MIGRATION_DATABASE: postgres
        run: |
          npx tsx src/server/migrationRunner.ts run

      - name: Verify all migrations were applied
        env:
          DATABASE_URL: postgres://ag_owner:ag_owner_password@localhost:5432/postgres
          DB_MIGRATION_USER: ag_owner
          DB_MIGRATION_PASSWORD: ag_owner_password
          DB_MIGRATION_HOST: localhost
          DB_MIGRATION_DATABASE: postgres
        run: |
          npx tsx src/server/migrationRunner.ts verify

      - name: Run migrations again (second run - should be idempotent)
        env:
          DATABASE_URL: postgres://ag_owner:ag_owner_password@localhost:5432/postgres
          DB_MIGRATION_USER: ag_owner
          DB_MIGRATION_PASSWORD: ag_owner_password
          DB_MIGRATION_HOST: localhost
          DB_MIGRATION_DATABASE: postgres
        run: |
          npx tsx src/server/migrationRunner.ts run

      - name: Verify zero new migrations on second run
        env:
          DATABASE_URL: postgres://ag_owner:ag_owner_password@localhost:5432/postgres
          DB_MIGRATION_USER: ag_owner
          DB_MIGRATION_PASSWORD: ag_owner_password
          DB_MIGRATION_HOST: localhost
          DB_MIGRATION_DATABASE: postgres
        run: |
          npx tsx src/server/migrationRunner.ts verify

      - name: Test checksum mismatch detection (regression test)
        env:
          DATABASE_URL: postgres://ag_owner:ag_owner_password@localhost:5432/postgres
          DB_MIGRATION_USER: ag_owner
          DB_MIGRATION_PASSWORD: ag_owner_password
          DB_MIGRATION_HOST: localhost
          DB_MIGRATION_DATABASE: postgres
        run: |
          FIRST_MIGRATION=$(ls packages/db/migrations/*.sql | grep -v test_ | sort | head -1)
          echo "Testing checksum mismatch on: $FIRST_MIGRATION"
          cp "$FIRST_MIGRATION" "$FIRST_MIGRATION.bak"
          echo "-- MODIFIED FOR CHECKSUM TEST $(date)" >> "$FIRST_MIGRATION"
          if npx tsx src/server/migrationRunner.ts run; then
            echo "ERROR: Migration runner should have failed on checksum mismatch!"
            mv "$FIRST_MIGRATION.bak" "$FIRST_MIGRATION"
            exit 1
          else
            echo "SUCCESS: Migration runner correctly failed on checksum mismatch"
            mv "$FIRST_MIGRATION.bak" "$FIRST_MIGRATION"
            exit 0
          fi

      - name: Final verification - all migrations still match after restore
        env:
          DATABASE_URL: postgres://ag_owner:ag_owner_password@localhost:5432/postgres
          DB_MIGRATION_USER: ag_owner
          DB_MIGRATION_PASSWORD: ag_owner_password
          DB_MIGRATION_HOST: localhost
          DB_MIGRATION_DATABASE: postgres
        run: |
          npx tsx src/server/migrationRunner.ts verify
          echo "✅ All migration tests passed!"

  # ──────────────────────────────────────────────────────────────────────
  # STAGE 7: Workflow Tests (placeholder)
  # ──────────────────────────────────────────────────────────────────────
  workflow-tests:
    name: Workflow Tests
    runs-on: ubuntu-latest
    needs: [db-migration-test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Placeholder — workflow tests not yet implemented
        run: echo "Workflow tests not yet implemented; add when available"

  # ──────────────────────────────────────────────────────────────────────
  # STAGE 8: Security Scan (FS + Container)
  # ──────────────────────────────────────────────────────────────────────
  security-scan-fs:
    name: Security Scan — Trivy FS
    runs-on: ubuntu-latest
    needs: [workflow-tests]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ──────────────────────────────────────────────────────────────────────
  # STAGE 9: Build (parallel per subsystem) — FINAL GATE
  # ──────────────────────────────────────────────────────────────────────
  build-web:
    name: Build — apps/web
    runs-on: ubuntu-latest
    needs: [security-scan-fs]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  build-ai-frontend:
    name: Build — ag-associates-ai/frontend
    runs-on: ubuntu-latest
    needs: [security-scan-fs]
    defaults:
      run:
        working-directory: ag-associates-ai/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-associates-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  build-platform:
    name: Build — ag-platform
    runs-on: ubuntu-latest
    needs: [security-scan-fs]
    defaults:
      run:
        working-directory: ag-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-platform/package-lock.json
      - run: npm ci
      - run: npm run build

  build-ai-backend:
    name: Build — ag-associates-ai/backend (validate install)
    runs-on: ubuntu-latest
    needs: [security-scan-fs]
    defaults:
      run:
        working-directory: ag-associates-ai/backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ag-associates-ai/backend/requirements.txt
      - run: pip install --dry-run -r requirements.txt

  # ──────────────────────────────────────────────────────────────────────
  # STAGE 10: Commit Lint (PR only, runs in parallel, not blocking merge)
  # ──────────────────────────────────────────────────────────────────────
  commitlint:
    name: Lint — Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm init -y
      - run: npm install @commitlint/cli @commitlint/config-conventional
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ──────────────────────────────────────────────────────────────────────
  # KNOWN PRE-EXISTING FAILURE BASELINES (documented for fail-closed policy)
  # ──────────────────────────────────────────────────────────────────────
  # These are documented baselines. A change is CLEAN if it does not INCREASE
  # the failure count from these baselines. All jobs FAIL THE PIPELINE on error
  # (fail-closed). Remediation tasks exist for each.
  #
  # 1. lint-python (ruff 0.16.1, working-dir=ag-associates-ai/backend): 874 errors
  #    - Ruled widened default in 0.16 (UP, RUF, I, B, SIM, BLE, S, DTZ)
  #    - Remediation: fix ruff errors incrementally or pin rule set
  #
  # 2. lint-js-web (pre-commit/action): 1 failure (whitespace in session-ses_19a4.md)
  #    - Committed session transcript with trailing whitespace
  #    - Remediation: delete session-ses_19a4.md or fix whitespace
  #
  # 3. unit-tests-js-platform (vitest on Node 20): needs 'ws' transport
  #    - vitest WebSocket transport missing on Node < 22
  #    - Remediation: upgrade to Node 22+ or add ws polyfill
  #
  # 4. security-scan-fs (Trivy): may have pre-existing CRITICAL/HIGH
  #    - Baseline to be established on first clean run
  #    - Remediation: fix vulnerabilities or add .trivyignore with justification
  #
  # 5. CodeQL (in main.yml): separate workflow, not blocking CI
  #
  # REMEDIATION TRACKING: tasks/ci-remediation.md (create if missing)