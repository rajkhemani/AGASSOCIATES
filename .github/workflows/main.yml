name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pre-commit/action@v3.0.1

  ag-associates-ai-frontend:
    name: ag-associates-ai / frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-associates-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ag-associates-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ag-associates-ai-backend:
    name: ag-associates-ai / backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-associates-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ag-associates-ai/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browsers
        run: playwright install chromium
      - name: Lint with Ruff
        run: pip install ruff==0.16.1 && ruff check .
      - name: Check formatting with Ruff
        run: ruff format --check .
      - name: Validate requirements.txt installs
        run: pip install --dry-run -r requirements.txt
      - name: Run pytest
        run: pytest --cov=./ --cov-report=xml --cov-fail-under=50
        env:
          ENVIRONMENT: test
          LLM_MOCK_MODE: "true"
          DATABASE_PASSWORD: "test_password"
          SUPABASE_JWT_SECRET: "test_jwt_secret"
          N8N_WEBHOOK_KEY: "test_webhook_key"
          TELEGRAM_BOT_TOKEN: "test_bot_token"
          IGR_PORTAL_USERNAME: "test_user"
          IGR_PORTAL_PASSWORD: "test_pass"
          ZOHO_EMAIL_PASS: "test_email_pass"

  ag-platform:
    name: ag-platform / turbo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ag-platform/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  # CodeQL Analysis (runs weekly and on PRs)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"