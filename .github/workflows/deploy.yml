name: Deploy to Production VPS

on:
  push:
    branches: [main]
    paths:
      - "ag-associates-ai/**"
      - "ag-platform/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: rajkhemani

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ag-ai-backend
            context: ag-associates-ai/backend
            build_args: ""
          - name: ag-ai-dashboard
            context: ag-associates-ai/frontend
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.${{ vars.PROD_DOMAIN }}
          - name: ag-platform
            context: ag-platform
            build_args: |
              VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}
              VITE_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
              VITE_API_BASE_URL=/api
          - name: telegram-bot
            context: ag-associates-ai/backend/telegram_bot
            build_args: ""
          - name: intake-api
            context: ag-platform/services/intake-api
            build_args: ""
          - name: email-intake
            context: ag-associates-ai/backend/email_intake
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ag
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_TOKEN
          script: |
            set -euo pipefail
            DEPLOY_DIR="/srv/ag/deploy-${{ github.sha }}"
            rm -rf "$DEPLOY_DIR"
            git clone https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            export IMAGE_TAG=${{ github.sha }}
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml --env-file /srv/ag/.env pull
            docker compose -f docker-compose.prod.yml --env-file /srv/ag/.env up -d --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file /srv/ag/.env restart caddy
            docker image prune -f
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Smoke test — Telegram webhook
        run: |
          for i in 1 2 3 4 5 6; do
            result=$(curl -sf "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getWebhookInfo" 2>&1)
            url=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['url'])" 2>/dev/null)
            err=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'].get('last_error_message',''))" 2>/dev/null)
            echo "webhook=$url err=$err"
            if [ -n "$url" ]; then
              echo "Deploy verified — bot webhook: $url"; exit 0
            fi
            echo "retrying ($i/6)…"; sleep 10
          done
          echo "Smoke test failed"; exit 1