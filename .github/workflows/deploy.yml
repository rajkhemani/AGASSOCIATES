name: Deploy to Production VPS

on:
  push:
    branches: [main]
    paths:
      - "ag-associates-ai/**"
      - "ag-platform/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: rajkhemani

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ag-ai-backend
            context: ag-associates-ai/backend
            build_args: ""
          - name: ag-ai-dashboard
            context: ag-associates-ai/frontend
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.${{ vars.PROD_DOMAIN }}
          - name: ag-platform
            context: ag-platform
            build_args: |
              VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}
              VITE_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
              VITE_API_BASE_URL=/api
          - name: telegram-bot
            context: ag-associates-ai/backend/telegram_bot
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ag
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_TOKEN
          script: |
            set -euo pipefail
            sudo rm -rf /srv/ag/repo || rm -rf /srv/ag/repo
            sudo chown -R $(whoami) /srv/ag 2>/dev/null || true
            git clone https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git /srv/ag/repo
            cd /srv/ag/repo
            export IMAGE_TAG=${{ github.sha }}
            docker compose --env-file /srv/ag/.env pull
            docker compose --env-file /srv/ag/.env up -d --remove-orphans
            docker image prune -f
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Smoke test API health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf "https://api.${{ vars.PROD_DOMAIN }}/health" >/dev/null; then
              echo "API healthy"; exit 0
            fi
            echo "waiting for API ($i/6)…"; sleep 10
          done
          echo "API failed to become healthy"; exit 1
