name: Setup GitHub Pages Custom Domain

on:
  workflow_dispatch:

jobs:
  setup-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check Pages API
        run: |
          echo "=== Current Pages Status ==="
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/${{ github.repository }}/pages | jq .

      - name: Try to create custom domain
        run: |
          echo "=== Attempting to add domain via API ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/domains \
            -d '{"domain":"advadiityagade.com"}')
          echo "$RESPONSE"

      - name: Alternative - Try updating CNAME via Pages API
        run: |
          echo "=== Trying PATCH to set CNAME ==="
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"cname":"advadiityagade.com"}' | jq .