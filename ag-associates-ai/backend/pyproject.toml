[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-associates-ai"
version = "2.0.0"
description = "AG Associates AI Document Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "python-telegram-bot[webhooks]>=21.0.0",
    "pgvector>=0.2.5",
    "langgraph>=1.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "reportlab==4.0.8",
    "pdfkit==1.0.0",
    "sentence-transformers>=2.2.0",
    "pdfplumber==0.10.3",
    "PyJWT==2.8.0",
    "tenacity==8.2.3",
    "langsmith>=0.1.0",
    "playwright>=1.41.0",
    "boto3>=1.34.0",
    "redis>=5.0.1",
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
    "soundfile>=0.12.1",
    "cryptography>=42.0.0",
    "gspread>=6.1.0",
    "crewai>=0.80.0",
    "sentry-sdk>=2.15.0",
    "python-multipart",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-prometheus>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41.0",
    "opentelemetry-instrumentation-httpx>=0.41.0",
    "opentelemetry-instrumentation-redis>=0.41.0",
    "opentelemetry-instrumentation-psycopg2>=0.41.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "fakeredis>=2.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "requires_vllm: Tests requiring vLLM",
    "requires_db: Tests requiring database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20",
]
ignore = [
    "E501",  # line too long
    "B008",  # function calls in default argument
]