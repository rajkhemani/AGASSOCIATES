[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-associates-ai"
version = "2.0.0"
description = "AG Associates AI Document Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "python-telegram-bot[webhooks]>=21.0.0",
    "pgvector>=0.2.5",
    "langgraph>=1.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "reportlab==4.0.8",
    "pdfkit==1.0.0",
    "sentence-transformers>=2.2.0",
    "pdfplumber==0.10.3",
    "PyJWT==2.8.0",
    "tenacity==8.2.3",
    "langsmith>=0.1.0",
    "playwright>=1.41.0",
    "boto3>=1.34.0",
    "redis>=5.0.1",
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
    "soundfile>=0.12.1",
    "cryptography>=42.0.0",
    "gspread>=6.1.0",
    "crewai>=0.80.0",
    "sentry-sdk>=2.15.0",
    "python-multipart",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-prometheus>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41.0",
    "opentelemetry-instrumentation-httpx>=0.41.0",
    "opentelemetry-instrumentation-redis>=0.41.0",
    "opentelemetry-instrumentation-psycopg2>=0.41.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "fakeredis>=2.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=./ --cov-report=xml --cov-fail-under=50"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
version = "0.16.1"
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "T20", # flake8-print (print statements)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]
per-file-ignores = {
    "test_*.py": ["S101", "S106"],  # allow assert and hardcoded passwords in tests
}

[tool.ruff.lint.isort]
known-first-party = ["app", "backend", "agents", "workflows", "email_intake", "telegram_bot", "media", "database", "auth", "config"]
import-headings = {
    "std": ["stdlib", "standard library"],
    "3rd": ["third-party"],
    "1st": ["first-party"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.format.docstring]
code-formatters = { python = "black" }